<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <pattern id="studsGray" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="7" fill="#d4d4d4"/>
    </pattern>
    <pattern id="studsBlue" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="7" fill="rgba(255,255,255,0.22)"/>
    </pattern>
  </defs>

  <rect width="1400" height="820" fill="#e8e8e8"/>
  <rect width="1400" height="820" fill="url(#studsGray)"/>

  <!-- sidebar -->
  <rect width="260" height="820" fill="#0055bf"/>
  <rect width="260" height="820" fill="url(#studsBlue)"/>
  <circle cx="40" cy="48" r="12" fill="#ffd500" stroke="#111" stroke-width="3"/>
  <text x="65" y="58" fill="#fff" font-family="Arial Black, sans-serif" font-size="30">FlowPilot</text>
  <text x="40" y="90" fill="#ffd500" font-family="Arial Black, sans-serif" font-size="14">BRICK STUDIO</text>

  <rect x="20" y="130" width="220" height="48" rx="8" fill="#ffd500" stroke="#111" stroke-width="3"/>
  <text x="55" y="161" fill="#111" font-family="Arial Black, sans-serif" font-size="16">DASHBOARD</text>
  <rect x="20" y="190" width="220" height="48" rx="8" fill="transparent" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <text x="55" y="221" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">WORKFLOWS</text>
  <rect x="20" y="250" width="220" height="48" rx="8" fill="transparent" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <text x="55" y="281" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">RUNS</text>
  <rect x="20" y="310" width="220" height="48" rx="8" fill="transparent" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <text x="55" y="341" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">DOCUMENTS</text>
  <rect x="20" y="370" width="220" height="48" rx="8" fill="transparent" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <text x="55" y="401" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">TEMPLATES</text>

  <rect x="20" y="740" width="220" height="44" rx="8" fill="#e3000b" stroke="#111" stroke-width="3"/>
  <text x="80" y="768" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">LOG OUT</text>

  <!-- yellow header -->
  <rect x="260" width="1140" height="120" fill="#ffd500" stroke="#111" stroke-width="4"/>
  <circle cx="300" cy="40" r="10" fill="#e3000b" stroke="#111" stroke-width="2"/>
  <circle cx="330" cy="40" r="10" fill="#0055bf" stroke="#111" stroke-width="2"/>
  <circle cx="360" cy="40" r="10" fill="#00a651" stroke="#111" stroke-width="2"/>
  <text x="290" y="85" fill="#111" font-family="Arial Black, sans-serif" font-size="36">Dashboard</text>
  <text x="290" y="110" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="700">Monitor workflows, runs, and document knowledge</text>
  <rect x="1120" y="40" width="220" height="48" rx="8" fill="#e3000b" stroke="#111" stroke-width="3"/>
  <text x="1155" y="71" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">+ NEW WORKFLOW</text>

  <!-- metric bricks -->
  <rect x="300" y="160" width="320" height="140" rx="10" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="330" y="210" fill="#666" font-family="Arial Black, sans-serif" font-size="16">WORKFLOWS</text>
  <text x="330" y="270" fill="#111" font-family="Arial Black, sans-serif" font-size="56">4</text>

  <rect x="650" y="160" width="320" height="140" rx="10" fill="#00a651" stroke="#111" stroke-width="4"/>
  <text x="680" y="210" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">RECENT RUNS</text>
  <text x="680" y="270" fill="#fff" font-family="Arial Black, sans-serif" font-size="56">7</text>

  <rect x="1000" y="160" width="320" height="140" rx="10" fill="#0055bf" stroke="#111" stroke-width="4"/>
  <text x="1030" y="210" fill="#fff" font-family="Arial Black, sans-serif" font-size="16">ACTIVE</text>
  <text x="1030" y="270" fill="#fff" font-family="Arial Black, sans-serif" font-size="56">2</text>

  <!-- list panel -->
  <rect x="300" y="330" width="1020" height="430" rx="10" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="330" y="380" fill="#111" font-family="Arial Black, sans-serif" font-size="24">Latest workflows</text>

  <rect x="330" y="410" width="960" height="70" rx="8" fill="#fff7cc" stroke="#111" stroke-width="3"/>
  <text x="360" y="453" fill="#111" font-family="Arial Black, sans-serif" font-size="20">Resume Reviewer Agent</text>
  <rect x="1120" y="428" width="140" height="34" rx="6" fill="#00a651" stroke="#111" stroke-width="2"/>
  <text x="1155" y="451" fill="#fff" font-family="Arial Black, sans-serif" font-size="14">ACTIVE</text>

  <rect x="330" y="500" width="960" height="70" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="360" y="543" fill="#111" font-family="Arial Black, sans-serif" font-size="20">Customer Support Auto-Reply</text>
  <rect x="1120" y="518" width="140" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1160" y="541" fill="#111" font-family="Arial Black, sans-serif" font-size="14">DRAFT</text>

  <rect x="330" y="590" width="960" height="70" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="360" y="633" fill="#111" font-family="Arial Black, sans-serif" font-size="20">Research Summarizer Agent</text>
  <rect x="1120" y="608" width="140" height="34" rx="6" fill="#ffd500" stroke="#111" stroke-width="2"/>
  <text x="1145" y="631" fill="#111" font-family="Arial Black, sans-serif" font-size="14">RUNNING</text>
</svg>
